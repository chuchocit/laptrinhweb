<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="wrapper">

    <!-- HEADER -->
    <div class="header">
        <a href="#">Home</a> |
        <a href="login.html">Đăng nhập</a> |
        <a href="#">Đăng ký</a>
    </div>

    <!-- REGISTER BOX -->
    <div class="login-box">
        <h2>Màn hình đăng ký</h2>

        <div class="form-group">
            <label>Username</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password">
        </div>

        <div class="form-group">
            <label>Nhập lại mật khẩu</label>
            <input type="password">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email">
        </div>

        <div class="form-group action">
            <a href="login.html" class="forgot">Đã có tài khoản</a>
            <button>Đăng ký</button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Lập trình web @01/2024
    </div>

</div>

</body>
</html>
