<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật</title>

</head>
<body>

<div class="wrapper">

    <!-- HEADER -->
    <div class="header">

        <a href="login.html">Đăng nhập</a> |

    <!-- UPDATE BOX -->
    <div class="login-box">
        <h2>Màn hình cập nhật</h2>

        <div class="form-group">
            <label>Username</label>
            <input type="text" value="user1">
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" value="user1">
        </div>

        <div class="form-group">
            <label>Nhập lại mật khẩu</label>
            <input type="password" value="user1">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" value="user@gmail.com">
        </div>

        <div class="form-group action">
            <a href="list.html" class="forgot">Quay lại</a>
            <button>Cập nhật</button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Lập trình web @01/2024
